appId: md.docu.desktop
productName: docu.md
copyright: GPL-3.0-only

directories:
  app: dist/desktop
  output: dist

files:
  - '**/*'
  # esbuild bundles every runtime dependency into main.cjs (chokidar included),
  # so the app needs no node_modules at all. Without this exclusion
  # electron-builder resolves production deps from the ROOT package.json, which
  # lists ~100 packages (mermaid, vega, slidev, echarts, vite) under
  # "dependencies" — that pulled 2.6GB into app.asar and made the universal
  # lipo step stall on two ~2GB bundles.
  - '!node_modules'
  - '!node_modules/**/*'

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  # electron-builder rasterizes SVG at 1024px; the 128px extension icon is too
  # small for a valid macOS .icns (minimum 512px).
  icon: icons/icon.svg
  darkModeSupport: true
  # Signing and notarization are deliberately out of scope for local builds.
  identity: null

dmg:
  artifactName: ${productName}-${version}-universal.${ext}
